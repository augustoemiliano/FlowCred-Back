name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, migrações e testes
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-secret-key-not-used-in-production
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Migrações aplicam e batem com os modelos
        run: |
          alembic upgrade head
          alembic check

      - name: Testes
        run: pytest

  docker:
    name: Build e smoke test Docker
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Subir com docker compose
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Aguardar health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test da API
        run: FLOWCRED_SMOKE_BASE=http://localhost:8001/api/v1 python3 -m app.scripts.smoke_flowcred

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Parar
        if: always()
        run: docker compose down -v
